[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-adapter"
version = "2.0.0"
description = "PM-Adapter v2: schema-driven, deterministic, zero-LLM-call state ownership for harnesses (packet validation, event log, derived state, keyed vault, match step, packet assembly); the original Morse frame decoder lives in pm_adapter.legacy"
requires-python = ">=3.8"
dependencies = []                       # standard library only

[project.optional-dependencies]
legacy = ["pro-memoria @ git+https://github.com/rikirinjani/pro-memoria.git"]      # only for decoding Morse frames (pm_adapter.legacy)

[tool.setuptools.packages.find]
where = ["."]
include = ["pm_adapter*"]

[tool.setuptools.package-data]
pm_adapter = ["schemas/*.json"]
